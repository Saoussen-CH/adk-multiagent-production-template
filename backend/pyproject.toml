[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-support-backend"
version = "0.1.0"
description = "FastAPI backend for Customer Support MAS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.160.0",
    "google-cloud-firestore>=2.16.0",
    "vertexai>=1.38.0",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "bcrypt>=4.0.0",
    "google-cloud-modelarmor>=0.1.0",
    # The backend imports customer_support_mas.rate_limiting (per-tenant rate
    # limiting on /api/chat) and customer_support_mas.providers.registry
    # (resolving a tenant's CommerceProvider for the refund-approval
    # endpoints). Without this declaration the Cloud Run image has no
    # customer_support_mas at all and uvicorn dies with ModuleNotFoundError
    # on startup. The package's __init__ exports root_agent lazily, so this
    # dependency does NOT make the backend construct the agent graph.
    "customer-support-mas",
]

[tool.uv.sources]
customer-support-mas = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
